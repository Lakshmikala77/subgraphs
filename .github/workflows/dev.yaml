name: Coprocessor (ap, dev) deploy.

on:
  pull_request:
    types: [edited, opened]

env:
  BRANCH: ${{ github.event.pull_request.base.ref }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

  tests_coverage:
    needs: lint
    name: Test Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

  build:
    needs: tests_coverage
    name: Build Coprocessor Applications
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Extract Subgraph Names from PR
        id: extract_subgraphs
        run: |
          PR_BODY=$(jq -r '.pull_request.body' < "$GITHUB_EVENT_PATH")
          echo "PR_BODY Content: $PR_BODY"
          
          SUBGRAPH_NAMES=()
          while IFS= read -r line; do
            SUBGRAPH=$(echo "$line" | awk -F'`' '{print $2}' | tr -d '\r')
            if [[ -n "$SUBGRAPH" ]]; then
              SUBGRAPH_NAMES+=("$SUBGRAPH")
            fi
          done < <(echo "$PR_BODY" | grep -i "Subgraph Name:")

          echo "Extracted Subgraph Names: ${SUBGRAPH_NAMES[*]}"
          echo "SUBGRAPH_NAMES=${SUBGRAPH_NAMES[*]}" >> $GITHUB_ENV

      - name: Build and Push Docker Images
        run: |
          IFS=' ' read -r -a SUBGRAPH_ARRAY <<< "${{ env.SUBGRAPH_NAMES }}"
          for SUBGRAPH in "${SUBGRAPH_ARRAY[@]}"; do
            echo "Building Docker Image for Subgraph: $SUBGRAPH"
            # docker build -t gcr.io/my-project/$SUBGRAPH:latest .
            # docker push gcr.io/my-project/$SUBGRAPH:latest
          done

  deploy:
    name: Deploy Coprocessor Applications
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Parse and Validate PR Body
        id: parse_pr
        run: |
          PR_BODY=$(jq -r '.pull_request.body' < "$GITHUB_EVENT_PATH")
          echo "PR_BODY=$PR_BODY"
          DEV_AP=$(echo "$PR_BODY" | grep -A 4 "Dev Environment" | grep "AP Region:" | awk -F'`' '{print $2}')
          echo "DEV_AP=$DEV_AP" >> $GITHUB_ENV
      - name: Deploy Using Helm
        run: |
          IFS=' ' read -r -a SUBGRAPH_ARRAY <<< "${{ env.SUBGRAPH_NAMES }}"
          for SUBGRAPH in "${SUBGRAPH_ARRAY[@]}"; do
            echo "Deploying Subgraph: $SUBGRAPH"
            echo "Dev:AP=$DEV_AP"
            helm upgrade --install $SUBGRAPH ./helm/$SUBGRAPH \
              --namespace=dev \
              --set image.tag=latest \
              --wait --atomic \
              --timeout 10m \
              --debug
          done
