name: Coprocessor (ap, dev) deploy.

on:
  pull_request:
    types: [edited, opened]

env:
  BRANCH: ${{ github.event.pull_request.base.ref }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

  tests_coverage:
    needs: lint
    name: Test Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

  build:
    needs: tests_coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      subgraph_names_json: ${{ steps.extract_subgraphs.outputs.SUBGRAPH_NAMES_JSON }}
    steps:
      - name: Extract Subgraph Names from PR
        id: extract_subgraphs
        run: |
          PR_BODY=$(jq -r '.pull_request.body' < "$GITHUB_EVENT_PATH")
          echo "PR_BODY Content: $PR_BODY"

          # Extract subgraph names
          SUBGRAPH_NAMES=()
          while IFS= read -r line; do
            SUBGRAPH=$(echo "$line" | awk -F'`' '{print $2}' | tr -d '\r')
            if [[ -n "$SUBGRAPH" ]]; then
              SUBGRAPH_NAMES+=("\"$SUBGRAPH\"")  # Ensure valid JSON string format
            fi
          done < <(echo "$PR_BODY" | grep -i "Subgraph Name:")

          # Convert array to JSON (compact format)
          SUBGRAPH_JSON=$(echo "[${SUBGRAPH_NAMES[*]}]" | jq -c .)
          echo "Extracted JSON: $SUBGRAPH_JSON"

          # Store output safely
          echo "SUBGRAPH_NAMES_JSON=$SUBGRAPH_JSON" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy Coprocessor Applications
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        subgraph: ${{ fromJson(needs.build.outputs.subgraph_names_json) }}
    steps:
      - name: Deploy Using Helm
        run: |
          echo "Deploying Subgraph: ${{ matrix.subgraph }}"
